<!-- ==========================================================================
     CICLO — 폰트 로딩 (WPCode > HTML Snippet > Site Wide **Header**)
     ==========================================================================
     global.css v2 에서 @import 2개를 제거하고 이리로 옮겼다.

     왜 옮겼나
       @import 는 요청이 직렬로 쌓인다:
         global.css 다운로드 → 파싱 → 폰트 CSS 2개 요청 → 파싱 → 폰트 파일 요청
       왕복 3번이 끝나야 글자가 제 폰트로 그려진다. FCP·LCP 를 직접 깎는다.
       head 의 <link> 는 HTML 파싱 시점에 바로 병렬로 나간다.

     ★ 이 스니펫을 넣지 않으면 폰트가 적용되지 않는다. CSS 교체와 세트다.

     Archivo 는 걷어냈다 — 사이트 전체를 Pretendard 하나로 통일했다.
     함께 사라진 것:
       - 렌더 차단 스타일시트 1장 (fonts.googleapis.com/css2?family=Archivo)
       - 서드파티 오리진 2개 (fonts.googleapis.com · fonts.gstatic.com)
         → preconnect 2줄도 같이 뺐다. DNS+TLS 왕복 두 번이 없어진다
       - Archivo woff2 3벌 (700 / 800 / 900)
     이제 남은 외부 폰트 오리진은 jsdelivr 하나뿐이다.
     ========================================================================== -->

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<!-- 더 밀어붙이려면(선택)
     Pretendard 를 자체 호스팅하면 남은 서드파티 오리진 하나(DNS+TLS)까지
     사라져 PageSpeed 에서 확실한 추가 점수가 된다. dynamic-subset 은 유니코드
     범위별로 woff2 가 쪼개져 있어 파일 수가 많지만(CSS 1 + woff2 15), 한글
     사이트에서는 그 방식이 오히려 전송량이 작다. 미디어에 올리고 위 <link> 의
     href 만 내부 경로로 바꾸면 된다. -->

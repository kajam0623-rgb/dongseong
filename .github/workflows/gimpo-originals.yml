# 김포 작품 원본 찾기(한 번만 쓰고 지운다). 작업 환경에서 cdn.imweb.me 에 닿지 않아 여기서 받는다.
name: gimpo-originals
on:
  push:
    branches: [claude/ilsan-anitok-project-arpdi5]
    paths: ['anitok-campuses/tools/originals/match.py', '.github/workflows/gimpo-originals.yml']
permissions:
  contents: write
jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python anitok-campuses/tools/originals/match.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anitok-campuses/tools/originals/out
          git commit -m "김포 작품 원본 후보 대조 결과" || exit 0
          git push
